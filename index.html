<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkSense Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="header">
            <div class="logo-area">
                <h1>WorkSense</h1>
                <p>Physical Workload Assessment</p>
            </div>
            <div class="demo-badge">
                <span>⚗️ Demo Mode</span>
            </div>
        </header>

        <nav class="tabs-nav">
            <button class="tab-btn active">Overview</button>
            <button class="tab-btn">Trends</button>
            <button class="tab-btn">History</button>
            <button class="tab-btn">Methods</button>
        </nav>

        <main class="main-content">
            <section class="filters">
                <div class="filter-group">
                    <label>Worker ID</label>
                    <select><option>W-001</option></select>
                </div>
                <div class="filter-group">
                    <label>Time Window</label>
                    <select><option>Last 30 minutes</option></select>
                </div>
            </section>

            <section class="data-cards">
                <div class="card">
                    <div class="card-header">
                        <h3>HEART RATE</h3> <span>❤️</span>
                    </div>
                    <div class="value">82 <span>BPM</span></div>
                    <p class="subtitle">Latest demo reading</p>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3>TEMPERATURE</h3> <span>🌡️</span>
                    </div>
                    <div class="value">24.5 <span>°C</span></div>
                    <p class="subtitle">Ambient temperature</p>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3>HUMIDITY</h3> <span>💧</span>
                    </div>
                    <div class="value">48 <span>%</span></div>
                    <p class="subtitle">Relative humidity</p>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3>FATIGUE SCORE</h3> <span>⏱️</span>
                    </div>
                    <div class="value">N/A</div>
                    <p class="subtitle">Calculation pending</p>
                </div>
            </section>

        </main>
    </div>
</body>
</html>
